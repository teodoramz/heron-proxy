apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: proxy-waf
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: proxy-waf/api:latest
          envFrom:
            - secretRef: { name: proxy-waf }
          env:
            - name: BLOB_DIR
              value: /data/blobs
            - name: API_PROXY_STREAM_URL
              value: ws://proxy:9090/internal/stream
            - name: API_SECURE_COOKIES
              value: "true"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: blobs
              mountPath: /data/blobs
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: blobs
          persistentVolumeClaim: { claimName: blobs }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: proxy-waf
spec:
  selector: { app: api }
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: proxy-waf
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: proxy-waf/web:latest
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet: { path: /, port: 8081 }
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: proxy-waf
spec:
  selector: { app: web }
  ports:
    - port: 8081
      targetPort: 8081
