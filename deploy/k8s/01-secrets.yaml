# Replace every value before applying. ENCRYPTION_KEY must be exactly 32 bytes.
apiVersion: v1
kind: Secret
metadata:
  name: proxy-waf
  namespace: proxy-waf
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  CLICKHOUSE_PASSWORD: change-me
  ENCRYPTION_KEY: change-me-to-32-bytes-exactly!!!
  SESSION_KEY: change-me-to-a-long-random-string
  INTERNAL_STREAM_TOKEN: change-me-to-a-random-string
  ADMIN_EMAIL: admin@example.com
  ADMIN_PASSWORD: change-me-at-least-12-chars
  POSTGRES_DSN: postgres://proxywaf:change-me@postgres:5432/proxywaf?sslmode=disable
  CLICKHOUSE_DSN: clickhouse://default:change-me@clickhouse:9000/proxywaf
