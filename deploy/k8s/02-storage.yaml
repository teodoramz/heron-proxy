apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spool
  namespace: heron
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: blobs
  namespace: heron
spec:
  # The proxy writes bodies and the api reads them, so both mount this claim.
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata
  namespace: heron
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chdata
  namespace: heron
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 200Gi
