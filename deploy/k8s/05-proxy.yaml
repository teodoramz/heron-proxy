apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: proxy-waf
spec:
  # One replica: the spool is a ReadWriteOnce volume, and v1 is a single node.
  # Scaling out requires the broker-backed sink.
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: proxy }
  template:
    metadata:
      labels: { app: proxy }
    spec:
      containers:
        - name: proxy
          image: proxy-waf/proxy:latest
          envFrom:
            - secretRef: { name: proxy-waf }
          env:
            - name: SPOOL_DIR
              value: /data/spool
            - name: BLOB_DIR
              value: /data/blobs
            - name: PROXY_RULES_DIR
              value: /rules
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
            - name: admin
              containerPort: 9090
          volumeMounts:
            - name: spool
              mountPath: /data/spool
            - name: blobs
              mountPath: /data/blobs
            - name: rules
              mountPath: /rules
          readinessProbe:
            httpGet: { path: /healthz, port: 9090 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { memory: 512Mi, cpu: 500m }
      volumes:
        - name: spool
          persistentVolumeClaim: { claimName: spool }
        - name: blobs
          persistentVolumeClaim: { claimName: blobs }
        - name: rules
          configMap: { name: proxy-waf-rules, optional: true }
---
apiVersion: v1
kind: Service
metadata:
  name: proxy
  namespace: proxy-waf
spec:
  type: LoadBalancer
  selector: { app: proxy }
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: v1
kind: Service
metadata:
  name: proxy-admin
  namespace: proxy-waf
spec:
  selector: { app: proxy }
  ports:
    - port: 9090
      targetPort: 9090
